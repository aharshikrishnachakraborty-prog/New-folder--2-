<!DOCTYPE html>
<html>
<head>
    <title>ByteXL Navbar</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        
        .navbar1{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 30px;
            background-color:#f5f5f5;
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            color:green;
        }

        .menu{
            display:flex;
            gap:40px;
            list-style:none;
        }

        .menu a{
            text-decoration:none;
            color:black;
            font-weight:bold;
        }

        .signin{
            background-color:#1f2937;
            color:white;
            border:none;
            padding:10px 20px;
            border-radius:6px;
            cursor:pointer;
        }

        hr{
            border:1px solid #ddd;
        }

        /* Second Navbar */
        .navbar2{
            padding:15px 20px;
            background-color:white;
        }

        .categories{
            display:flex;
            justify-content:center;
            gap:30px;
            list-style:none;
            flex-wrap:wrap;
        }

        .categories a{
            text-decoration:none;
            color:#333;
            font-size:15px;
        }
    </style>
</head>

<body>

    
    <div class="navbar1">

        <div class="logo">ByteXL</div>

        <ul class="menu">
            <li> Courses </li>
            <li> Tutorials </li>
            <li>Practice</li>
            <li>Jobs</li>
        </ul>

        <button class="signin">Sign In</button>

    </div>

    <hr>

    
    <div class="navbar2">
        <ul class="categories">
            <li>DSA</li>
            <li>Practice Problems</li>
            <li>>C</li>
            <li>C++</a></li>
            <li><a href="#">Java</a></li>
            <li><a href="#">Python</a></li>
            <li><a href="#">JavaScript</a></li>
            <li><a href="#">Data Science</a></li>
            <li><a href="#">Machine Learning</a></li>
            <li><a href="#">Courses</a></li>
            <li><a href="#">Linux</a></li>
            <li><a href="#">DevOps</a></li>
        </ul>
    </div>

</body>
</html>
